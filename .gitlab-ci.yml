        - tempdir=`mktemp -d`
        - docker run --rm $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA-go1.21| tar -C $tempdir -x
        - tar -cvzf pvr-$CI_COMMIT_TAG-go1.21.linux.amd64.tar.gz -C $tempdir/bin/linux_amd64 pvr
