        - echo CWD `pwd`
        - sh -c "cd $tempdir/bin/windows_386/; zip pvr-$CI_COMMIT_TAG-go1.21.windows.x32.zip pvr.exe"
        - cp $tempdir/bin/windows_386/pvr-$CI_COMMIT_TAG-go1.21.windows.x32.zip .
        - sh -c "cd $tempdir/bin/windows_amd64/; zip pvr-$CI_COMMIT_TAG-go1.21.windows.x64.zip pvr.exe"
        - cp $tempdir/bin/windows_amd64/pvr-$CI_COMMIT_TAG-go1.21.windows.x64.zip .
        - cp $tempdir/pvr-vendor.tar.gz ./pvr-vendor-$CI_COMMIT_TAG-go1.21.tar.gz
    artifacts:
        paths:
            - pvr-$CI_COMMIT_TAG-go1.21.linux.amd64.tar.gz
            - pvr-$CI_COMMIT_TAG-go1.21.linux.arm64.tar.gz
            - pvr-$CI_COMMIT_TAG-go1.21.linux.arm.tar.gz
            - pvr-$CI_COMMIT_TAG-go1.21.darwin.amd64.tar.gz
            - pvr-$CI_COMMIT_TAG-go1.21.darwin.arm64.tar.gz
            - pvr-$CI_COMMIT_TAG-go1.21.windows.x32.zip
            - pvr-$CI_COMMIT_TAG-go1.21.windows.x64.zip
            - pvr-vendor-$CI_COMMIT_TAG-go1.21.tar.gz
