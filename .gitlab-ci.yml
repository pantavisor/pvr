        - docker pull $CONTAINER_IMAGE:stable-go1.21 || true
        - docker build -f Dockerfile.go1.21 --build-arg DOCKERTAG=stable --cache-from $CONTAINER_IMAGE:stable-go1.21 --tag $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA-go1.21 --tag $CONTAINER_IMAGE:stable-go1.21 .
        - test -n "$CI_COMMIT_TAG" && docker tag $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA-go1.21 $CONTAINER_IMAGE:$CI_COMMIT_TAG-go1.21 || true
