image: docker:27.3.1-cli # Use a modern client

stages:
    - test
    - build
    - deploy

services:
    - name: docker:27.3.1-dind # Use a matching server
      alias: docker

variables:
    CONTAINER_IMAGE: registry.gitlab.com/$CI_PROJECT_PATH
    DOCKER_DRIVER: overlay2
    # buildkit wraps even single-platform builds in an OCI image index with a
    # provenance attestation. pvr self-upgrade reads plain image manifests only
    # (libpvr/dockerlib_legacy.go), so the index makes it fail with
    # "image not found". Disable the default attestations -> plain manifest.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

# Auto-retry transient CI infrastructure failures (slow dind startup, runner
# hiccups, intermittent registry auth blips when pulling dependency images).
default:
    retry:
        max: 2
        when:
            - runner_system_failure
            - stuck_or_timeout_failure
            - script_failure
            - api_failure
            - unknown_failure

before_script:
    # The docker:dind service can take a while to come up; running a docker
    # command before the daemon is ready fails with
    # "Cannot connect to the Docker daemon ...". Wait for it to be ready.
    - |
      echo "Waiting for the Docker daemon to be ready..."
      for i in $(seq 1 60); do
        docker info >/dev/null 2>&1 && { echo "Docker daemon is up after ${i}s"; break; }
        sleep 1
      done
      docker info >/dev/null 2>&1 || { echo "ERROR: Docker daemon did not become ready in time"; exit 1; }
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    - apk update
    - apk add --no-cache zip curl tar findutils

run-test:
    stage: test
    variables:
        FF_NETWORK_PER_BUILD: "true"
    script:
        - docker pull $CONTAINER_IMAGE:test-latest || true
        - docker build -f Dockerfile.test --cache-from $CONTAINER_IMAGE:test-latest --tag $CONTAINER_IMAGE:test-$CI_COMMIT_SHORT_SHA --tag $CONTAINER_IMAGE:test-latest .
        - docker run --rm -e CI=true -v /var/run/docker.sock:/var/run/docker.sock -v $HOME/.docker:/root/.docker:ro $CONTAINER_IMAGE:test-$CI_COMMIT_SHORT_SHA
        - docker push $CONTAINER_IMAGE:test-$CI_COMMIT_SHORT_SHA
        - docker push $CONTAINER_IMAGE:test-latest

build-tags:
    stage: build
    script:
        - docker pull $CONTAINER_IMAGE:stable || true
        - docker build --build-arg DOCKERTAG=stable --cache-from $CONTAINER_IMAGE:stable --tag $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA --tag $CONTAINER_IMAGE:stable --tag $CONTAINER_IMAGE:$CI_COMMIT_TAG .
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA
        - docker push $CONTAINER_IMAGE:stable
        - docker push $CONTAINER_IMAGE:$CI_COMMIT_TAG
        # Guard: old pvr self-upgrade can only read plain v2 manifests.
        - sh ci/verify-plain-manifest.sh "$CI_PROJECT_PATH" stable "$CI_COMMIT_TAG" "$CI_COMMIT_SHORT_SHA"
        - tempdir=`mktemp -d`
        - docker run --rm $CONTAINER_IMAGE:$CI_COMMIT_SHORT_SHA| tar -C $tempdir -x
        - tar -cvzf pvr-$CI_COMMIT_TAG.linux.amd64.tar.gz -C $tempdir/bin/linux_amd64 pvr
        - tar -cvzf pvr-$CI_COMMIT_TAG.linux.arm.tar.gz -C $tempdir/bin/linux_arm pvr
        - tar -cvzf pvr-$CI_COMMIT_TAG.linux.arm64.tar.gz -C $tempdir/bin/linux_arm64 pvr
        - tar -cvzf pvr-$CI_COMMIT_TAG.darwin.amd64.tar.gz -C $tempdir/bin/darwin_amd64 pvr
        - tar -cvzf pvr-$CI_COMMIT_TAG.darwin.arm64.tar.gz -C $tempdir/bin/darwin_arm64 pvr
        - echo CWD `pwd`
        - sh -c "cd $tempdir/bin/windows_386/; zip pvr-$CI_COMMIT_TAG.windows.x32.zip pvr.exe"
        - cp $tempdir/bin/windows_386/pvr-$CI_COMMIT_TAG.windows.x32.zip .
        - sh -c "cd $tempdir/bin/windows_amd64/; zip pvr-$CI_COMMIT_TAG.windows.x64.zip pvr.exe"
        - cp $tempdir/bin/windows_amd64/pvr-$CI_COMMIT_TAG.windows.x64.zip .
        - cp $tempdir/pvr-vendor.tar.gz ./pvr-vendor-$CI_COMMIT_TAG.tar.gz
    artifacts:
        paths:
            - pvr-$CI_COMMIT_TAG.linux.amd64.tar.gz
            - pvr-$CI_COMMIT_TAG.linux.arm64.tar.gz
            - pvr-$CI_COMMIT_TAG.linux.arm.tar.gz
            - pvr-$CI_COMMIT_TAG.darwin.amd64.tar.gz
            - pvr-$CI_COMMIT_TAG.darwin.arm64.tar.gz
            - pvr-$CI_COMMIT_TAG.windows.x32.zip
            - pvr-$CI_COMMIT_TAG.windows.x64.zip
            - pvr-vendor-$CI_COMMIT_TAG.tar.gz
        expire_in: never
    only:
        - tags

