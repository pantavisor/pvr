name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build test image
        run: docker build -f Dockerfile.test -t pvr-test .

      # The tests start docker containers, so the tester needs the host docker socket.
      - name: Run tests
        run: docker run --rm -e CI=true -v /var/run/docker.sock:/var/run/docker.sock pvr-test
