name: sync-gitlab

# Bridge for pvr 059 and older, which only read GitLab packages and registry.
# Runs only when the GITLAB_PUSH_TOKEN secret is set.
on:
  push:
    branches: [main, main-draft]
    tags: ['**']

permissions:
  contents: read

concurrency:
  group: sync-gitlab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
    steps:
      - name: Check for token
        id: gate
        run: |
          if [ -n "$GITLAB_PUSH_TOKEN" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "GITLAB_PUSH_TOKEN not set, skipping"; fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # GitLab master has different history, so branches go to `main` and are never forced.
      - name: Push to GitLab
        if: steps.gate.outputs.go == 'true'
        run: |
          set -eu
          auth=$(printf 'oauth2:%s' "$GITLAB_PUSH_TOKEN" | base64 -w0)
          g() { git -c "http.extraHeader=Authorization: Basic $auth" "$@"; }
          url=https://gitlab.com/pantacor/pvr.git
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            g push "$url" "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          else
            g push "$url" "$GITHUB_SHA:refs/heads/main"
          fi
